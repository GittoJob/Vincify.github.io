<!doctype html>
<html>
<head><meta charset="utf-8"><title>Creators</title></head>
<body>
<h1>Creators</h1>
<ul id="list">
  <li>Loading creators…</li>
</ul>
<hr>
<script>
fetch('creators.json')
  .then(r => r.json())
  .then(data => {
    const list = document.getElementById('list');
    list.innerHTML = '';
    Object.keys(data)
      .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }))
      .forEach(name => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = 'creator.html?p=' + encodeURIComponent(name);
        a.textContent = name;
        li.appendChild(a);
        list.appendChild(li);
      });
  })
  .catch(() => {
    document.getElementById('list').textContent = 'Could not load creators.json';
  });
</script>
</body>
<footer>
    <small><pre>
        Html: Jacko
        Javascript: Jacko, Chatgpt
        Css: Jacko
    </pre></small>
</footer>
</html>
